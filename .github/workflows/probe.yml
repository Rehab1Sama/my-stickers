name: probe
on:
  push:
    paths:
      - .github/workflows/probe.yml
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://stickerly.pstatic.net/sticker_pack/UtMOSVhC5ax65RFbvRuZg/IBIIBX/16
          for f in b3734699-028a-4e80-b198-24e393402abf 669c6ab8-6aae-47f8-ae9d-4686fcd02aee; do
            curl -sS -o /dev/null -m 30 -w "webp %{http_code} %{time_total}s %{size_download}B\n" $B/$f.webp
            curl -sS -o /dev/null -m 30 -w "png  %{http_code} %{time_total}s %{size_download}B\n" $B/$f.png
            python3 -c "import urllib.request,time;t=time.time();d=urllib.request.urlopen(urllib.request.Request('$B/$f.webp',headers={'User-Agent':'androidapp.stickerly/2.17.0'}),timeout=20).read();print('py',len(d),time.time()-t)" || true
          done
