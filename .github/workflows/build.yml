name: build-stickers

on:
  workflow_dispatch:
  push:
    paths:
      - links.txt

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Get WhatsApp sticker app template
        run: git clone --depth 1 https://github.com/WhatsApp/stickers.git wa

      - name: Download sticker packs
        run: |
          pip install pillow
          cat > fetch_packs.py <<'PY'
          import json, os, re, sys, io, time, shutil
          import urllib.request
          from PIL import Image

          ASSETS = sys.argv[2] if len(sys.argv) > 2 else "assets_out"
          LINKS = sys.argv[1] if len(sys.argv) > 1 else "links.txt"
          UA = "androidapp.stickerly/2.17.0 (M2012K11AG; U; Android 29; ar; sa;)"
          EMOJI = ["🌸"]


          def get(url, headers=None, tries=2):
              for i in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers or {"User-Agent": UA})
                      with urllib.request.urlopen(req, timeout=20) as r:
                          return r.read()
                  except Exception as e:
                      last = e
                      time.sleep(1)
              raise last


          def fetch_meta(code):
              for v in ("v4", "v3.2", "v3.1"):
                  url = "https://api.sticker.ly/%s/stickerPack/%s?needRelation=true" % (v, code)
                  try:
                      data = json.loads(get(url, {"User-Agent": UA, "Host": "api.sticker.ly"}))
                  except Exception as e:
                      print("  api %s failed: %s" % (v, e))
                      continue
                  res = data.get("result") if isinstance(data, dict) else None
                  if res:
                      return res
                  print("  api %s gave: %s" % (v, str(data)[:200]))
              return None


          def sticker_urls(code):
              meta = fetch_meta(code)
              name, author, urls = None, None, []
              if meta:
                  name = meta.get("name")
                  author = meta.get("authorName") or (meta.get("user") or {}).get("userName")
                  prefix = meta.get("resourceUrlPrefix") or ""
                  items = meta.get("stickers") or meta.get("resourceFileNames") or meta.get("resourceFiles") or []
                  tray = meta.get("trayResourceUrl") or ""
                  for it in items:
                      if isinstance(it, dict):
                          tray = tray or (it.get("stickerPack") or {}).get("trayResourceUrl") or ""
                          if not name:
                              name = (it.get("stickerPack") or {}).get("name")
                  if not prefix and tray:
                      prefix = tray.rsplit("/", 1)[0] + "/"
                  for it in items:
                      fn = it.get("fileName") if isinstance(it, dict) else it
                      if fn and (fn.startswith("http") or prefix):
                          urls.append(fn if fn.startswith("http") else prefix + fn)
                  if not urls:
                      print("  meta keys:", list(meta.keys()))
              if not urls:
                  # fallback: read the public page
                  try:
                      html = get("https://sticker.ly/s/" + code, {"User-Agent": "Mozilla/5.0"}).decode("utf8", "ignore")
                      found = re.findall(r'https?://[^"\'\s>]+?\.webp', html)
                      seen = []
                      for u in found:
                          u = u.replace("\\u002F", "/").replace("\\/", "/")
                          if u not in seen and "tray" not in u.lower():
                              seen.append(u)
                      urls = seen
                      m = re.search(r'<title>([^<]+)</title>', html)
                      if m and not name:
                          name = m.group(1).split("|")[0].strip()
                  except Exception as e:
                      print("  page failed:", e)
              return name, author, urls


          def info(raw):
              im = Image.open(io.BytesIO(raw))
              anim = getattr(im, "is_animated", False) and getattr(im, "n_frames", 1) > 1
              durs = []
              if anim:
                  for f in range(im.n_frames):
                      im.seek(f)
                      im.load()
                      durs.append(im.info.get("duration", 0) or 0)
                  im.seek(0)
              return im, anim, durs


          def fix_static(raw):
              im = Image.open(io.BytesIO(raw)).convert("RGBA")
              if im.size != (512, 512):
                  im.thumbnail((512, 512))
                  canvas = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
                  canvas.paste(im, ((512 - im.width) // 2, (512 - im.height) // 2))
                  im = canvas
              for q in (90, 80, 70, 60, 50, 40, 30):
                  b = io.BytesIO()
                  im.save(b, "WEBP", quality=q, method=6)
                  if b.tell() < 100 * 1024:
                      return b.getvalue()
              return None


          def make_tray(raw):
              im = Image.open(io.BytesIO(raw))
              im.seek(0)
              im = im.convert("RGBA")
              im.thumbnail((96, 96))
              canvas = Image.new("RGBA", (96, 96), (0, 0, 0, 0))
              canvas.paste(im, ((96 - im.width) // 2, (96 - im.height) // 2))
              b = io.BytesIO()
              canvas.save(b, "PNG", optimize=True)
              if b.tell() >= 50 * 1024:
                  b = io.BytesIO()
                  canvas.convert("P", palette=Image.ADAPTIVE).save(b, "PNG", optimize=True)
              return b.getvalue()


          def main():
              text = open(LINKS, encoding="utf8").read()
              codes = []
              for c in re.findall(r'sticker\.ly/s/([A-Za-z0-9]+)', text):
                  c = c.upper()
                  if c not in codes:
                      codes.append(c)
              print("found %d links" % len(codes))
              if os.path.exists(ASSETS):
                  shutil.rmtree(ASSETS)
              os.makedirs(ASSETS)
              packs, failed = [], []
              for n, code in enumerate(codes, 1):
                  print("[%d/%d] %s" % (n, len(codes), code))
                  try:
                      name, author, urls = sticker_urls(code)
                  except Exception as e:
                      print("  error:", e); failed.append(code); continue
                  good_static, good_anim = [], []
                  for u in urls:
                      try:
                          raw = None
                          if u.lower().endswith(".png"):
                              try:
                                  raw = get(u[:-4] + ".webp", tries=1)
                              except Exception:
                                  raw = None
                          if raw is None:
                              raw = get(u)
                          im, anim, durs = info(raw)
                      except Exception as e:
                          print("  skip sticker:", e); continue
                      if anim:
                          ok = (im.size == (512, 512) and len(raw) < 500 * 1024
                                and all(d >= 8 for d in durs) and sum(durs) <= 10000)
                          if ok:
                              good_anim.append(raw)
                          else:
                              print("  skip animated sticker (does not meet WhatsApp rules)")
                      else:
                          if im.size == (512, 512) and len(raw) < 100 * 1024 and im.format == "WEBP":
                              good_static.append(raw)
                          else:
                              f = fix_static(raw)
                              if f: good_static.append(f)
                  animated = len(good_anim) > len(good_static)
                  chosen = good_anim if animated else good_static
                  if len(chosen) < 3:
                      print("  pack skipped: only %d usable stickers" % len(chosen)); failed.append(code); continue
                  # split into chunks of up to 30
                  chunks = [chosen[i:i + 30] for i in range(0, len(chosen), 30)]
                  if len(chunks) > 1 and len(chunks[-1]) < 3:
                      chunks = chunks[:-1]
                  for ci, chunk in enumerate(chunks):
                      ident = "p%02d_%s%s" % (n, code, "" if ci == 0 else "_%d" % ci)
                      d = os.path.join(ASSETS, ident)
                      os.makedirs(d)
                      stickers = []
                      for si, raw in enumerate(chunk):
                          fn = "s%02d.webp" % si
                          open(os.path.join(d, fn), "wb").write(raw)
                          stickers.append({"image_file": fn, "emojis": EMOJI})
                      open(os.path.join(d, "tray.png"), "wb").write(make_tray(chunk[0]))
                      pname = ("%d - %s" % (n, (name or code)))[:120]
                      if ci: pname = (pname + " (%d)" % (ci + 1))[:128]
                      packs.append({
                          "identifier": ident, "name": pname,
                          "publisher": (author or "sticker.ly")[:120],
                          "tray_image_file": "tray.png", "image_data_version": "1",
                          "avoid_cache": False, "publisher_email": "", "publisher_website": "",
                          "privacy_policy_website": "", "license_agreement_website": "",
                          "animated_sticker_pack": animated, "stickers": stickers})
                      print("  ok: %s (%d stickers%s)" % (pname, len(chunk), ", animated" if animated else ""))
              if not packs:
                  print("No packs could be downloaded."); sys.exit(1)
              json.dump({"android_play_store_link": "", "ios_app_store_link": "", "sticker_packs": packs},
                        open(os.path.join(ASSETS, "contents.json"), "w", encoding="utf8"), ensure_ascii=False, indent=1)
              summary = "Packs ready: %d\nFailed links: %d %s" % (len(packs), len(failed), " ".join(failed))
              print(summary)
              open("summary.txt", "w").write(summary)


          main()
          PY
          python -u fetch_packs.py links.txt wa/Android/app/src/main/assets

      - name: Name the app
        working-directory: wa/Android
        run: |
          sed -i 's/applicationId "com.example.samplestickerapp"/applicationId "com.rehab.mystickers"/' app/build.gradle
          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">ملصقاتي</string>|' app/src/main/res/values/strings.xml
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          mkdir -p ~/.android
          if [ -f "$GITHUB_WORKSPACE/keystore/debug.keystore" ]; then cp "$GITHUB_WORKSPACE/keystore/debug.keystore" ~/.android/debug.keystore; fi

      - name: Build the app
        working-directory: wa/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/my-stickers.apk"

      - name: Keep the same signing key for next time
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            cp ~/.android/debug.keystore keystore/debug.keystore
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add keystore/debug.keystore
            git commit -m "save signing key [skip ci]"
            git push
          fi

      - name: Publish the app
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stickers-${{ github.run_number }}
          name: ملصقاتي ${{ github.run_number }}
          body_path: summary.txt
          files: my-stickers.apk
